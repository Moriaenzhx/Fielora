[workspace]
members = [
  "crates/fielora-core",
  "crates/fielora-contracts",
  "crates/fielora-field",
  "crates/fielora-storage",
  "crates/fielora-platform",
  "crates/fielora-model",
  "crates/fielora-agent",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
rusqlite = { version = "=0.40.2", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt"] }
ts-rs = { version = "12", features = ["serde-compat", "uuid-impl"] }
uuid = { version = "1", features = ["serde", "v7"] }
tokio = { version = "=1.53.1", features = ["rt-multi-thread", "macros", "sync", "time", "net"] }
tokio-util = { version = "=0.7.19", features = ["rt"] }
reqwest = { version = "=0.13.4", default-features = false, features = ["rustls", "json", "stream"] }
futures-util = "=0.3.34"
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security_Credentials", "Win32_System_JobObjects", "Win32_System_Threading"] }

[profile.release]
strip = "symbols"
lto = "thin"
