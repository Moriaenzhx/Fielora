[workspace]
members = [
  "crates/fielora-core",
  "crates/fielora-contracts",
  "crates/fielora-field",
  "crates/fielora-storage",
  "crates/fielora-platform",
  "crates/fielora-model",
  "crates/fielora-agent",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
rusqlite = { version = "=0.40.2", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt"] }
ts-rs = { version = "12", features = ["serde-compat", "uuid-impl"] }
uuid = { version = "1", features = ["serde", "v7"] }
tokio = { version = "=1.53.1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "process", "io-util"] }
tokio-util = { version = "=0.7.19", features = ["rt"] }
reqwest = { version = "=0.13.4", default-features = false, features = ["rustls", "json", "stream"] }
scraper = { version = "=0.27.0", default-features = false }
futures-util = "=0.3.34"
rmcp = { version = "=3.1.4", default-features = false, features = ["client", "transport-async-rw"] }
lopdf = { version = "=0.44.0", default-features = false }
office_oxide = { version = "=0.1.8", default-features = false }
png = { version = "=0.18.1", default-features = false }
quick-xml = { version = "=0.41.0", default-features = false }
regex = "=1.12.2"
zip = { version = "=8.6.0", default-features = false, features = ["deflate"] }
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security_Credentials", "Win32_Storage_FileSystem", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Registry", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging"] }
yaml_serde = { version = "=0.10.7", default-features = false, features = ["std"] }

[profile.release]
strip = "symbols"
lto = "thin"
