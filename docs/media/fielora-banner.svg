    <use href="#petal" transform="rotate(120 100 100)"/>
    <use href="#petal" transform="rotate(240 100 100)"/>
  </g>
  <g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif">
    <text x="60" y="64" font-size="12" font-weight="600" letter-spacing="3" fill="#786B98">OPEN SOURCE / LOCAL FIRST</text>
    <text x="55" y="165" font-size="91" font-weight="700" letter-spacing="-4" fill="#302547">Fielora</text>
    <text x="60" y="218" font-size="28" font-weight="400" fill="#514462">A local-first AI workspace.</text>
    <text x="60" y="254" font-size="18" fill="#756A85">Your projects, files, models and tools. In one place.</text>
    <path d="M60 290H108" stroke="#7B61CE" stroke-width="3" stroke-linecap="round"/>
    <text x="126" y="296" font-size="12" letter-spacing="2" fill="#786B98">BUILT AROUND YOUR WORK</text>
