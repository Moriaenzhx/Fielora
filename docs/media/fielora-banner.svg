<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
  <title id="title">Fielora</title>
  <desc id="desc">A local-first AI workspace. Your projects, files, models and tools, in one place.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F3EFFF"/><stop offset=".6" stop-color="#F6F7FD"/><stop offset="1" stop-color="#FCEEF5"/></linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#7D64DA"/><stop offset="1" stop-color="#5840C8"/></linearGradient>
    <path id="petal" d="M44 65C8 72 24 16 97 26C126 28 156 42 151 53C110 62 88 93 44 65Z"/>
  </defs>
  <rect width="1200" height="340" rx="22" fill="url(#paper)"/>
  <circle cx="1030" cy="180" r="258" fill="none" stroke="#E3DCF5"/>
  <circle cx="1030" cy="180" r="200" fill="none" stroke="#E3DCF5"/>
  <circle cx="1030" cy="180" r="142" fill="#EEE8FA" fill-opacity=".65"/>
  <g transform="translate(878 34) scale(1.45)" fill="url(#ink)">
